name: JetBrains Plugin

on:
  push:
    branches: [ "main" ]
    paths:
      - 'external/raml-lsp-jetbrains/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'external/raml-lsp-jetbrains/**'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build
      run: make build-plugin-jetbrains
